name: citibike
version: "1.0"
config-version: 2

profile: citibike_snowflake
model-paths: ["models"]
analysis-paths: ["analysis"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  citibike:
    raw:
      +materialized: table
      +schema: raw # models/schema = raw
    refined:
      +materialized: table
      +schema: refined # models/schema = refined
    customised:
      +materialized: view
      +schema: customised
